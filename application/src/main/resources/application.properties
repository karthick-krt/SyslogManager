# Application properties for Spring Boot application
spring.application.name=application
server.port=8080

# PostgreSQL datasource (adjust credentials/db)
spring.datasource.url=jdbc:postgresql://localhost:5432/syslogmanager
spring.datasource.username=postgres
spring.datasource.password=Test@123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Ensure Spring defers running data.sql until after Hibernate creates/updates the schema
spring.jpa.defer-datasource-initialization=true